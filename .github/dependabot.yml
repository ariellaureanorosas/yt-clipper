version: 2
updates:
  # Dependências Python (requirements*.txt), agrupadas para não gerar
  # uma PR por pacote.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    groups:
      python-deps:
        patterns:
          - "*"

  # Ações usadas no CI.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
