name: 🐛 Relatar um bug
description: Algo não funcionou como esperado.
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar! Antes de continuar, procure nas issues existentes
        se o problema já foi descrito.

        **Não inclua links privados, dados pessoais ou tokens.** Para falhas de
        segurança, use o canal privado descrito em `SECURITY.md`.

  - type: textarea
    id: descricao
    attributes:
      label: Descrição do problema
      description: O que aconteceu? Seja específico.
      placeholder: Ao clicar em Processar, o app fecha sozinho...
    validations:
      required: true

  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      description: Lista numerada do que você fez antes do erro.
      placeholder: |
        1. Colei o link ...
        2. Escolhi o formato Vertical
        3. Cliquei em Processar
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Comportamento esperado
      placeholder: O vídeo deveria ser salvo na pasta escolhida.
    validations:
      required: true

  - type: input
    id: versao
    attributes:
      label: Versão do aplicativo
      description: Aparece em **Ver Diagnóstico do Sistema**.
      placeholder: '1.1.0'
    validations:
      required: true

  - type: dropdown
    id: sistema
    attributes:
      label: Sistema operacional
      options:
        - Windows 11
        - Windows 10
        - Linux
        - macOS
        - Outro (descreva abaixo)
    validations:
      required: true

  - type: textarea
    id: diagnostico
    attributes:
      label: Diagnóstico do sistema
      description: |
        Abra o app, clique em **Ver Diagnóstico do Sistema**, copie o texto e
        cole aqui. Ele contém RAM, GPU e encoders disponíveis.
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log do aplicativo
      description: |
        Anexe ou cole o final de `%LOCALAPPDATA%\YouTubeClipper\logs\app.log`
        (no Windows). Remova qualquer informação sensível.
      render: text
    validations:
      required: false

  - type: textarea
    id: contexto
    attributes:
      label: Contexto adicional
      description: Vídeo específico? Trecho muito longo? GPU/antivírus?
    validations:
      required: false
