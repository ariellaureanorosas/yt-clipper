name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Menor privilégio possível: o CI só precisa ler o repositório.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint e formatação
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt
      - name: Instalar ferramentas
        run: pip install --upgrade pip ruff black
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check core ui tests main.py

  test:
    name: Testes
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Pytest
        run: python -m pytest
