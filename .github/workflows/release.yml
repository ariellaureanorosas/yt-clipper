name: Release

# Publica o instalador para Windows sempre que uma tag "v*" é enviada.
# Ex.: git tag v1.3.0 && git push origin v1.3.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # necessário para criar a Release e anexar artefatos

jobs:
  build:
    name: Compilar e publicar
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Validar versão da tag
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $source = (Select-String -Path core/__init__.py -Pattern "__version__ = '([^']+)'").Matches[0].Groups[1].Value
          Write-Host "Tag: $tag | core.__version__: $source"
          if ($tag -ne $source) {
            throw "A tag $tag não corresponde a core.__version__ ($source). Atualize a versão antes de publicar."
          }

      - name: Rodar testes
        run: python -m pytest -q

      - name: Baixar ffmpeg/ffprobe para embutir no instalador
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force assets | Out-Null
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg -Force
          $ffmpeg = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ffmpeg) { throw 'ffmpeg.exe não encontrado no pacote baixado.' }
          Copy-Item $ffmpeg.FullName assets/ffmpeg.exe -Force
          Copy-Item (Join-Path $ffmpeg.DirectoryName 'ffprobe.exe') assets/ffprobe.exe -Force
          Get-Item assets/ffmpeg.exe, assets/ffprobe.exe | Select-Object Name, Length | Format-Table

      - name: Compilar aplicativo (onedir)
        run: pyinstaller --clean --noconfirm build.spec

      - name: Compilar supervisor de atualização
        run: pyinstaller --clean --noconfirm build_helper.spec

      - name: Gerar instalador (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $candidates = @(
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Inno Setup (ISCC.exe) não encontrado.' }
          Write-Host "Usando $iscc"
          & $iscc "/DAppVersion=$version" 'installer\ytclipper.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou (exit $LASTEXITCODE)" }
          Get-ChildItem dist/installer | Select-Object Name, Length | Format-Table

      - name: Gerar checksum
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $asset = "dist/installer/YouTubeClipper-Setup-$version.exe"
          $name = Split-Path $asset -Leaf
          (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower() + "  $name" | Out-File -Encoding ascii "$asset.sha256"
          Get-Content "$asset.sha256"

      - name: Publicar Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          $notes = @"
          ## YouTube Clipper $tag

          Baixe o arquivo YouTubeClipper-Setup-$version.exe abaixo e execute.
          O instalador já inclui **tudo** o que o aplicativo precisa (Python,
          yt-dlp e ffmpeg) — não é preciso instalar nada antes nem baixar
          dependências na primeira execução.

          - Instala em %LOCALAPPDATA%\Programs\YouTubeClipper (não pede senha de administrador).
          - Cria atalhos no Menu Iniciar e na Área de Trabalho.
          - As próximas atualizações são baixadas e instaladas automaticamente.
          - O checksum SHA-256 está disponível no arquivo .sha256.

          > **Atualizando da v1.2.1 ou anterior:** baixe e execute este Setup
          > uma vez. A partir desta versão as atualizações voltam a ser automáticas.

          Consulte o [CHANGELOG](https://github.com/ariellaureanorosas/yt-clipper/blob/main/CHANGELOG.md)
          para ver o que mudou.
          "@
          gh release create $tag `
            --title "YouTube Clipper $tag" `
            --notes $notes `
            --verify-tag `
            "dist/installer/YouTubeClipper-Setup-$version.exe" `
            "dist/installer/YouTubeClipper-Setup-$version.exe.sha256"
