name: Release

# Publica um executável para Windows sempre que uma tag "v*" é enviada.
# Ex.: git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # necessário para criar a Release e anexar artefatos

jobs:
  build:
    name: Compilar e publicar
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Validar versão da tag
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $source = (Select-String -Path core/__init__.py -Pattern "__version__ = '([^']+)'").Matches[0].Groups[1].Value
          Write-Host "Tag: $tag | core.__version__: $source"
          if ($tag -ne $source) {
            throw "A tag $tag não corresponde a core.__version__ ($source). Atualize a versão antes de publicar."
          }

      - name: Rodar testes
        run: python -m pytest -q

      - name: Compilar executável
        run: pyinstaller --clean --noconfirm build.spec

      - name: Gerar checksum
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $asset = "YouTubeClipper-$version.exe"
          Copy-Item dist/YouTubeClipper.exe $asset
          (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower() + "  $asset" | Out-File -Encoding ascii "$asset.sha256"
          Get-Content "$asset.sha256"

      - name: Publicar Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $notes = @"
          ## YouTube Clipper $tag

          Baixe o arquivo `YouTubeClipper-$($tag.TrimStart('v')).exe` abaixo e execute.
          O checksum SHA-256 está disponível no arquivo `.sha256`.

          Consulte o [CHANGELOG](https://github.com/ariellaureanorosas/yt-clipper/blob/main/CHANGELOG.md)
          para ver o que mudou.
          "@
          gh release create $tag `
            --title "YouTube Clipper $tag" `
            --generate-notes `
            --notes $notes `
            --verify-tag `
            (Get-ChildItem YouTubeClipper-*.exe, YouTubeClipper-*.exe.sha256 | ForEach-Object { $_.FullName })
