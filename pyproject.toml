# Configuração de ferramentas de desenvolvimento (lint, formatação, testes).
#
# Este repositório NÃO é um pacote instalável via pip: é um app desktop
# empacotado com PyInstaller. Por isso aqui ficam apenas as configurações das
# ferramentas; as dependências continuam em requirements*.txt.

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["build", "dist", "assets"]

[tool.ruff.lint]
# E/W: erros e avisos do pycodestyle | F: pyflakes (imports/names) | I: isort
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # comprimento de linha é responsabilidade do black
]

[tool.black]
line-length = 88
target-version = ["py311"]
# Mantém as aspas simples usadas no projeto (evita reformatar tudo à toa).
skip-string-normalization = true
extend-exclude = '''
/(
    build
  | dist
  | assets
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=core --cov-report=term-missing"
# Permite importar "core" e "ui" a partir da raiz do projeto.
pythonpath = ["."]

[tool.coverage.run]
# A UI (Tkinter) não é coberta por testes unitários; medimos o núcleo lógico.
source = ["core"]
branch = true
omit = [
    "core/__init__.py",
]

[tool.coverage.report]
# Falha o CI se a cobertura do núcleo cair abaixo do mínimo acordado.
fail_under = 55
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

